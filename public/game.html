<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>제주 감귤 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b1530; overflow: hidden; font-family: Jua, 'Malgun Gothic', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); background: #000; box-shadow: 0 0 40px #000a; touch-action: none; }
  .tb { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 5; }
  .tb button, #back { background: rgba(20, 26, 58, .75); color: #fff; border: 1px solid #ffffff55; border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 15px; cursor: pointer; }
  .tb button:hover, #back:hover { background: rgba(60, 70, 130, .9); }
  .tb button.off { opacity: .45; }
  .tb button.live { background: #d6336c; }
  #back { position: fixed; top: 10px; left: 10px; z-index: 5; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #000b; color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 15px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 6; }
  #touch { position: fixed; bottom: 14px; left: 0; right: 0; display: none; justify-content: space-between; padding: 0 16px; z-index: 5; pointer-events: none; }
  #touch .grp { display: flex; gap: 12px; pointer-events: auto; }
  #touch button { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #fff8; background: #ffffff30; color: #fff; font: inherit; font-size: 20px; }
  #touch button:active { background: #ffffff70; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<a id="back" href="previous.html" style="text-decoration:none">← 돌아가기</a>
<div class="tb">
  <button id="bSnd" title="효과음/배경음악 (M)">🔊 소리</button>
  <button id="bVoi" title="음성 해설">🗣 해설</button>
  <button id="bMic" title="음성 명령: 점프 / 왼쪽 / 오른쪽 / 대시">🎤 음성명령</button>
</div>
<div id="toast"></div>
<div id="touch">
  <div class="grp"><button id="tL">◀</button><button id="tR">▶</button></div>
  <div class="grp"><button id="tD">⚡</button><button id="tJ">⬆</button></div>
</div>

<script>
'use strict';
/* =========================================================
   제주 감귤 대모험 — 2D 플랫폼 게임
   조작: ←/→(A/D) 이동 · Space/↑/W 점프(2단) · Shift/X 대시 · ↓+점프 아래로 · P 일시정지 · M 소리
   ========================================================= */
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 960, H = 540, GY = 440, GRAV = 2200;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
try { document.fonts.load('20px Jua'); } catch (e) {}

/* ---------------- 소리: 효과음 + BGM ---------------- */
let ac = null, master, sfxG, musG, noiseBuf, soundOn = true, voiceOn = true;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ac = new AC(); master = ac.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(ac.destination);
  sfxG = ac.createGain(); sfxG.gain.value = .8; sfxG.connect(master);
  musG = ac.createGain(); musG.gain.value = .32; musG.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone(f, d, type = 'square', v = .15, at = null, slide = 0, dest = null) {
  if (!ac) return; const t = at ?? ac.currentTime;
  const o = ac.createOscillator(), gn = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(gn); gn.connect(dest || sfxG); o.start(t); o.stop(t + d + .03);
}
function noise(d, v = .2, at = null, hp = 1500, dest = null) {
  if (!ac) return; const t = at ?? ac.currentTime;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f); f.connect(gn); gn.connect(dest || sfxG); s.start(t); s.stop(t + d + .02);
}
const SFX = {
  jump() { tone(380, .16, 'square', .12, null, 420); },
  dj() { tone(560, .16, 'triangle', .18, null, 600); },
  coin(c = 0) { const b = 880 * Math.pow(2, Math.min(c, 12) / 12); tone(b, .09, 'triangle', .2); tone(b * 1.5, .14, 'triangle', .2, ac && ac.currentTime + .07); },
  gold() { [988, 1319, 1760, 2093].forEach((f, i) => tone(f, .16, 'triangle', .2, ac && ac.currentTime + i * .06)); },
  stomp() { tone(200, .18, 'square', .22, null, -120); noise(.12, .25, null, 600); },
  hurt() { tone(300, .35, 'sawtooth', .22, null, -230); },
  power() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .14, 'square', .14, ac && ac.currentTime + i * .05)); },
  dash() { noise(.22, .25, null, 400); tone(300, .2, 'sawtooth', .08, null, 500); },
  cp() { [659, 784, 988].forEach((f, i) => tone(f, .2, 'triangle', .2, ac && ac.currentTime + i * .09)); },
  splash() { noise(.45, .3, null, 300); tone(260, .3, 'sine', .15, null, -200); },
  clear() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'square', .15, ac && ac.currentTime + i * .11)); },
  over() { [440, 392, 330, 262].forEach((f, i) => tone(f, .35, 'triangle', .22, ac && ac.currentTime + i * .22)); },
  boom() { noise(.6, .4, null, 120); tone(90, .5, 'sine', .35, null, -50); },
  thunder() { noise(1.2, .35, null, 80); },
  fw() { noise(.25, .15, null, 2500); tone(900, .3, 'sine', .08, null, -600); },
  life() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .12, 'square', .15, ac && ac.currentTime + i * .07)); },
};
const sfx = (n, ...a) => { if (ac && soundOn) SFX[n](...a); };

// BGM — 5음 음계(제주 민요 느낌) 스텝 시퀀서
const SONGS = [
  { bpm: 126, scale: [0, 2, 4, 7, 9], roots: [0, 0, 5, 7], mel: [0, 2, 4, 2, 5, 4, 2, -1, 3, 5, 7, 5, 4, 2, 0, -1], wave: 'square' },
  { bpm: 112, scale: [0, 3, 5, 7, 10], roots: [0, 3, 5, 3], mel: [4, -1, 3, 2, 0, -1, 2, 3, 5, 4, 3, -1, 2, 0, 1, -1], wave: 'triangle' },
  { bpm: 150, scale: [0, 3, 5, 6, 7], roots: [0, 0, 5, 6], mel: [0, 5, 4, 5, 0, 5, 7, 5, 4, 3, 2, 3, 4, -1, 2, -1], wave: 'sawtooth' },
];
let bgm = { song: 0, step: 0, next: 0, timer: null, on: false };
const hz = n => 261.63 * Math.pow(2, n / 12);
function bgmStart(si) {
  if (!ac) return; bgm.song = si; bgm.step = 0; bgm.next = ac.currentTime + .1;
  if (bgm.timer) clearInterval(bgm.timer);
  bgm.timer = setInterval(() => {
    const S = SONGS[bgm.song], dur = 60 / S.bpm / 2;
    while (bgm.next < ac.currentTime + .2) {
      const s = bgm.step, t = bgm.next, bar = Math.floor(s / 8) % S.roots.length, root = S.roots[bar];
      if (s % 2 === 0) tone(hz(root - 24), dur * 1.8, 'triangle', .45, t, 0, musG);
      if (s % 4 === 0) tone(150, .12, 'sine', .6, t, -110, musG);
      if (s % 8 === 4) noise(.12, .18, t, 1800, musG);
      if (s % 2 === 1) noise(.04, .07, t, 7000, musG);
      const d = S.mel[s % 16];
      if (d >= 0) { const n = S.scale[d % 5] + 12 * Math.floor(d / 5) + root; tone(hz(n), dur * 1.3, S.wave, .13, t, 0, musG); }
      if (s % 4 === 2) tone(hz(S.scale[(s / 2 | 0) % 5] + root + 12), dur * .8, 'sine', .08, t, 0, musG);
      bgm.next += dur; bgm.step++;
    }
  }, 30);
  bgm.on = true;
}
function bgmStop() { if (bgm.timer) clearInterval(bgm.timer); bgm.timer = null; bgm.on = false; }

/* ---------------- 음성: 해설(TTS) + 음성 명령(STT) ---------------- */
let lastSay = 0, koVoice = null;
function say(text, force) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  const now = performance.now(); if (!force && now - lastSay < 1800) return; lastSay = now;
  try {
    if (!koVoice) koVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('ko')) || null;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice;
    u.rate = 1.1; u.pitch = 1.3; u.volume = 1; speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { koVoice = null; };
const voice = { left: 0, right: 0, text: '', tt: 0, cool: {} };
let rec = null, micOn = false;
function handleVoice(raw) {
  const t = raw.replace(/\s/g, ''); let shown = false;
  const cmd = (k, re, fn, cd = .45) => {
    if (re.test(t) && (performance.now() - (voice.cool[k] || 0)) > cd * 1000) { voice.cool[k] = performance.now(); fn(); shown = true; }
  };
  cmd('j', /점프|뛰어|뛰|폴짝|점푸/, () => { if (state === 'title' || state === 'over' || state === 'win') onPress('Space'); else jumpPress(); });
  cmd('l', /왼쪽|왼|좌/, () => { voice.left = 1; voice.right = 0; });
  cmd('r', /오른쪽|오른|우측|앞으로/, () => { voice.right = 1; voice.left = 0; });
  cmd('d', /대시|돌진|빨리|질주/, () => dashPress());
  cmd('s', /멈춰|정지|스톱/, () => { voice.left = voice.right = 0; });
  cmd('b', /시작/, () => { if (state === 'title') onPress('Enter'); });
  if (shown) { voice.text = raw; voice.tt = 1.5; }
}
function toggleMic() {
  initAudio();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('이 브라우저는 음성 인식을 지원하지 않아요 (Chrome/Edge 권장)'); return; }
  if (micOn) { micOn = false; try { rec.stop(); } catch (e) {} syncBtns(); toast('음성 명령 끔'); return; }
  rec = new SR(); rec.lang = 'ko-KR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) handleVoice(e.results[i][0].transcript); };
  rec.onend = () => { if (micOn) { try { rec.start(); } catch (e) {} } };
  rec.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { micOn = false; syncBtns(); toast('마이크 권한이 필요해요 (로컬 서버/https에서만 동작)'); } };
  try { rec.start(); micOn = true; toast('🎤 "점프", "왼쪽", "오른쪽", "대시"라고 말해보세요'); } catch (e) { toast('음성 인식을 시작할 수 없어요'); }
  syncBtns();
}
let toastT = 0;
function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 3200); }
function syncBtns() {
  bSnd.classList.toggle('off', !soundOn); bVoi.classList.toggle('off', !voiceOn); bMic.classList.toggle('live', micOn);
}
const bSnd = document.getElementById('bSnd'), bVoi = document.getElementById('bVoi'), bMic = document.getElementById('bMic');
function toggleSound() { initAudio(); soundOn = !soundOn; if (master) master.gain.value = soundOn ? 1 : 0; syncBtns(); }
bSnd.onclick = e => { toggleSound(); e.target.blur(); };
bVoi.onclick = e => { voiceOn = !voiceOn; if (!voiceOn) try { speechSynthesis.cancel(); } catch (x) {} else say('음성 해설을 켰습니다', true); syncBtns(); e.target.blur(); };
bMic.onclick = e => { toggleMic(); e.target.blur(); };

/* ---------------- 입력 ---------------- */
const keys = {}, touch = { l: false, r: false };
const isLeft = () => keys.ArrowLeft || keys.KeyA || touch.l || voice.left > 0;
const isRight = () => keys.ArrowRight || keys.KeyD || touch.r || voice.right > 0;
const isDown = () => keys.ArrowDown || keys.KeyS;
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) onPress(e.code); keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) jumpRelease(); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touch.l = touch.r = false; });
function onPress(c) {
  initAudio();
  if (c === 'KeyM') { toggleSound(); return; }
  if (state === 'title') { if (c === 'Space' || c === 'Enter') startGame(); return; }
  if (state === 'over' || state === 'win') { if (c === 'Space' || c === 'Enter') { state = 'title'; bgmStart(0); } return; }
  if (c === 'KeyP' || c === 'Escape') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; return; }
  if (state !== 'play') return;
  if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') jumpPress();
  if (c === 'ShiftLeft' || c === 'ShiftRight' || c === 'KeyX' || c === 'KeyZ') dashPress();
}
function bindTouch(id, on, off) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); on(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, () => off && off()));
}
bindTouch('tL', () => touch.l = true, () => touch.l = false);
bindTouch('tR', () => touch.r = true, () => touch.r = false);
bindTouch('tJ', () => { if (state === 'title' || state === 'over' || state === 'win') onPress('Space'); else jumpPress(); }, jumpRelease);
bindTouch('tD', () => dashPress());
if ('ontouchstart' in window) document.getElementById('touch').style.display = 'flex';
cv.addEventListener('pointerdown', () => { initAudio(); if (state === 'title' || state === 'over' || state === 'win') onPress('Space'); });

/* ---------------- 스테이지 테마 ---------------- */
const THEMES = [
  { name: '감귤밭 오솔길', sky0: '#58c8ff', sky1: '#e8fbff', sun: '#fff6b0', sunX: 760, sunY: 110, mtn: '#7fa7a0', mtnTop: '#9fc4bb', sea0: '#37b6e8', sea1: '#1d86c4', hill1: '#6fcf6a', hill2: '#4fb05a', cloud: '#ffffffee' },
  { name: '해안도로 노을길', sky0: '#ff7e5f', sky1: '#ffe2a0', sun: '#fff0c0', sunX: 300, sunY: 250, mtn: '#9a6f8a', mtnTop: '#c99aa0', sea0: '#f59f7a', sea1: '#a85a8a', hill1: '#b8a85a', hill2: '#8a9a4a', cloud: '#ffd9c8dd' },
  { name: '한라산 폭풍 정상', sky0: '#1b2347', sky1: '#5d6a9c', sun: '#cfd8ff', sunX: 820, sunY: 90, mtn: '#46567a', mtnTop: '#dbe6ff', sea0: '#27406e', sea1: '#142548', hill1: '#2f6a58', hill2: '#244e46', cloud: '#7d89b8dd' },
];

/* ---------------- 상태 ---------------- */
let state = 'title', stage = 1, LV = null, P = { maxCombo: 0, kills: 0 }, tm = 0, shake = 0, stageTime = 0, clearT = 0, flash = 0;
let score = 0, oranges = 0, lives = 3, best = 0;
try { best = +localStorage.getItem('jeju_citrus_best') || 0; } catch (e) {}
const cam = { x: 0 };
let parts = [], floats = [], banner = { t: 0, text: '', sub: '' }, ambient = [], clouds = [];
for (let i = 0; i < 9; i++) clouds.push({ x: rnd(0, 2400), y: rnd(30, 190), s: rnd(.7, 1.6), v: rnd(4, 14) });
for (let i = 0; i < 90; i++) ambient.push({ x: rnd(0, W), y: rnd(0, H), v: rnd(.5, 1), p: rnd(0, 7) });

/* ---------------- 레벨 생성 ---------------- */
function buildLevel(n) {
  const R = mulberry(n * 7919 + 13), rr = (a, b) => a + R() * (b - a);
  const L = { n, solids: [], plats: [], coins: [], enemies: [], items: [], cps: [], decor: [], boss: null, len: 0 };
  let x = 0, idx = 0; const segs = [];
  const target = 5200 + n * 900;
  while (x < target) {
    const w = idx === 0 ? 760 : rr(430, 820), s = { x, y: GY, w, h: 200 };
    segs.push(s); L.solids.push(s); x += w;
    const gap = rr(110, 160 + n * 28);
    if (x < target) {
      for (let k = 0; k <= 5; k++) L.coins.push({ x: x - 20 + k * ((gap + 40) / 5), y: GY - 55 - Math.sin(Math.PI * k / 5) * 95, g: false, got: false, ph: R() * 6 });
      if (n >= 2 && R() < .55) L.plats.push({ x: x + gap / 2 - 45, y: GY - 80, w: 90, h: 14, mv: true, x0: x + gap / 2 - 45, rng: 40, sp: 1.7, dx: 0 });
      x += gap;
    }
    idx++;
  }
  const arenaW = n === 3 ? 1150 : 760, arena = { x, y: GY, w: arenaW, h: 200 };
  segs.push(arena); L.solids.push(arena); L.len = x + arenaW;
  L.arenaL = arena.x; L.arenaR = arena.x + arenaW; L.goalX = L.len - 150;
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], last = i === segs.length - 1, safe = i === 0;
    // 돌담, 나무, 풍력발전기, 유채꽃
    const dn = 2 + (R() * 3 | 0);
    for (let k = 0; k < dn; k++) {
      const t = ['tree', 'tree', 'palm', 'wall', 'flower', n < 3 ? 'turbine' : 'tree'][R() * 6 | 0];
      L.decor.push({ t, x: s.x + rr(40, s.w - 60), s: rr(.85, 1.2), z: R() < .5 ? 0 : 1 });
    }
    if (safe || last) {
      if (safe) { for (let k = 0; k < 6; k++) L.coins.push({ x: s.x + 340 + k * 42, y: GY - 28, g: false, got: false, ph: k }); }
      continue;
    }
    // 바닥 감귤
    if (R() < .75) { const cn = 3 + (R() * 4 | 0), cx = s.x + rr(50, s.w - 250); for (let k = 0; k < cn; k++) L.coins.push({ x: cx + k * 42, y: GY - 28, g: false, got: false, ph: k }); }
    // 공중 발판
    if (R() < .6) {
      const pw = rr(110, 170), px = s.x + rr(60, s.w - pw - 40), py = GY - rr(105, 140);
      L.plats.push({ x: px, y: py, w: pw, h: 14 });
      for (let k = 0; k < 4; k++) L.coins.push({ x: px + 22 + k * ((pw - 44) / 3), y: py - 28 - (k === 1 || k === 2 ? 14 : 0), g: false, got: false, ph: k });
      if (R() < .35) L.items.push({ x: px + pw / 2, y: py - 50, type: ['hanrabong', 'cheonhye', 'redhyang'][R() * 3 | 0], got: false });
    }
    if (R() < .3 + n * .05) {
      const pw = 110, px = s.x + rr(60, s.w - pw - 40), py = GY - 235;
      L.plats.push({ x: px, y: py, w: pw, h: 14 });
      L.coins.push({ x: px + pw / 2, y: py - 30, g: true, got: false, ph: 0 });
      if (R() < .5) L.items.push({ x: px + pw / 2, y: py - 80, type: ['hanrabong', 'cheonhye', 'redhyang'][R() * 3 | 0], got: false });
    }
    // 적
    const e0 = s.x + 150, e1 = s.x + s.w - 90;
    if (R() < .6 + n * .08) L.enemies.push({ type: 'crab', x: rr(e0, e1 - 160), y: GY - 28, w: 38, h: 28, min: s.x + 40, max: s.x + s.w - 40 - 38, dir: R() < .5 ? -1 : 1, t: R() * 5 });
    if (R() < .22 + n * .1) L.enemies.push({ type: 'urchin', x: rr(e0 + 60, e1), y: GY - 26, w: 30, h: 26, t: 0 });

  drawTang(34, 36, 11, false); txt('× ' + oranges, 52, 43, 24, '#fff');
  txt(String(score).padStart(7, '0'), 250, 43, 24, '#ffe9a8', 'right');
  for (let i = 0; i < Math.max(3, lives); i++) txt(i < lives ? '❤' : '♡', 24 + i * 24, 78, 22, i < lives ? '#ff5a7a' : '#ffffff66', 'left', null);
  txt(`STAGE ${stage}`, 250, 78, 18, '#cfe', 'right');
  // 진행바
  const bw = 300, bx = W / 2 - bw / 2; rrect(bx, 18, bw, 10, 5, 'rgba(0,0,0,.4)'); const pr = clamp(P.x / LV.goalX, 0, 1); rrect(bx, 18, Math.max(8, bw * pr), 10, 5, '#ffb02e'); circ(bx + bw * pr, 23, 8, '#ff7a00'); txt('🏁', bx + bw + 8, 31, 20, '#fff', 'left', null);
  // 콤보
  if (P.combo >= 3) { const mult = Math.min(5, 1 + Math.floor(P.combo / 5)); txt(`${P.combo} COMBO  x${mult}`, W - 24, 60, 30, '#ffd1e6', 'right', '#a1004a', 6); rrect(W - 24 - 160, 68, 160, 7, 3, 'rgba(0,0,0,.4)'); rrect(W - 24 - 160, 68, 160 * clamp(P.comboT / 1.7, 0, 1), 7, 3, '#ff80ab'); }
  // 파워업 타이머
  let py = 108; for (const [k, ic, col, mx] of [['magnet', '🧲', '#ffb300', 9], ['star', '⭐', '#ff80ab', 6], ['sjump', '🚀', '#ff5252', 10]]) if (P[k] > 0) { txt(ic, 20, py + 16, 22, '#fff', 'left', null); rrect(50, py + 4, 120, 10, 5, 'rgba(0,0,0,.4)'); rrect(50, py + 4, 120 * P[k] / mx, 10, 5, col); py += 30; }
  // 대시 쿨다운
  const dc = clamp(1 - P.dashCD / .7, 0, 1); rrect(W - 24 - 90, H - 34, 90, 8, 4, 'rgba(0,0,0,.4)'); rrect(W - 24 - 90, H - 34, 90 * dc, 8, 4, dc >= 1 ? '#7ee8ff' : '#4a7a8a'); txt('⚡대시', W - 24 - 96, H - 25, 14, '#cff', 'right', 'rgba(0,0,0,.5)', 3);
  // 보스 체력
  const B = LV.boss; if (B && B.active && !B.dead) { const bw2 = 360, bx2 = W / 2 - bw2 / 2; rrect(bx2 - 4, H - 54, bw2 + 8, 22, 11, 'rgba(0,0,0,.6)'); rrect(bx2, H - 50, bw2 * B.hp / B.max, 14, 7, '#ff4d4d'); txt('🦀 왕게', W / 2, H - 58, 18, '#ffd0d0', 'center'); }
  if (micOn) { txt('🎤 듣는 중…' + (voice.tt > 0 ? '  "' + voice.text + '"' : ''), 20, H - 20, 18, voice.tt > 0 ? '#9ff0ff' : '#ffffffaa', 'left', 'rgba(0,0,0,.6)', 4); }
  // 배너
  if (banner.t > 0) { const a = clamp(Math.min(banner.t, 3 - banner.t + .2) * 3, 0, 1); g.globalAlpha = a; txt(banner.text, W / 2, 190, 64, '#fff', 'center', '#d65a00', 10); txt(banner.sub, W / 2, 235, 28, '#fff3c0', 'center', 'rgba(0,0,0,.6)', 6); g.globalAlpha = 1; }
  if (flash > 0) { g.fillStyle = `rgba(255,60,60,${flash * 1.4})`; g.fillRect(0, 0, W, H); }
}
function panel(title, lines, sub) {
  g.fillStyle = 'rgba(5,10,30,.62)'; g.fillRect(0, 0, W, H);
  txt(title, W / 2, 170, 60, '#fff', 'center', '#d65a00', 10);
  lines.forEach((l, i) => txt(l, W / 2, 235 + i * 36, 26, '#fff7cf', 'center'));
  if (sub) txt(sub, W / 2, 440 + Math.sin(tm * 4) * 4, 26, '#fff', 'center');
}
function drawTitle() {
  g.fillStyle = 'rgba(5,10,30,.35)'; g.fillRect(0, 0, W, H);
  const bob = Math.sin(tm * 2) * 6;
  drawTang(W / 2 - 250, 130 + bob, 30, false); drawTang(W / 2 + 250, 130 - bob, 30, true);
  txt('제주 감귤 대모험', W / 2, 150 + bob * .5, 78, '#fff', 'center', '#d65a00', 14);
  txt('🍊 Jeju Tangerine Adventure 🍊', W / 2, 192, 26, '#fff3c0', 'center', 'rgba(0,0,0,.6)', 6);
  const tips = ['← → 이동   ·   Space / ↑ 점프 (공중에서 한 번 더!)', 'Shift / X 대시   ·   ↓ + 점프 : 발판 내려가기   ·   P 일시정지', '감귤을 모아 콤보! 게·갈매기는 밟고, 성게는 피하세요', '🧲 한라봉 자석   ⭐ 천혜향 무적   🚀 레드향 슈퍼점프', '🎤 음성명령 : "점프" "왼쪽" "오른쪽" "대시"'];
  tips.forEach((t, i) => txt(t, W / 2, 255 + i * 32, 21, '#fff', 'center', 'rgba(0,0,0,.65)', 5));
  txt('Space 또는 화면을 눌러 시작', W / 2, 466 + Math.sin(tm * 4) * 4, 30, '#ffe066', 'center', 'rgba(0,0,0,.7)', 7);
  if (best) txt('최고 점수 ' + best, W / 2, 506, 20, '#cfe', 'center');
}

/* ---------------- 루프 ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt);
  if (!LV) LV = buildLevel(1);
  drawBG(); drawWorld(); drawAmbientFront();
  if (state === 'title') drawTitle();
  else {
    drawHUD();
    if (state === 'pause') panel('일시정지', ['P 를 눌러 계속하기'], null);
    if (state === 'clear') { panel('STAGE CLEAR!', clearInfo ? [`클리어 시간 ${clearInfo.t.toFixed(1)}초`, `시간 보너스 +${clearInfo.tb}`, `목숨 보너스 +${clearInfo.lb}`, `점수 ${score}`] : [], null); }
    if (state === 'over') panel('GAME OVER', [`점수 ${score}`, `감귤 ${oranges}개 · 최대 콤보 ${P.maxCombo}`, `최고 점수 ${best}`], 'Space 를 눌러 다시 도전');
    if (state === 'win') panel('🍊 감귤왕 등극! 🍊', ['제주의 모든 스테이지를 클리어했어요!', `총점 ${score}`, `감귤 ${oranges}개 · 처치 ${P.kills} · 최대 콤보 ${P.maxCombo}`, `최고 점수 ${best}`], 'Space 를 눌러 처음으로');
  }
  requestAnimationFrame(frame);
}
syncBtns(); requestAnimationFrame(frame);
</script>
