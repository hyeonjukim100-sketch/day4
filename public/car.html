<head>

<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>제주 감귤 레이싱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>

  .tb button.live { background: #d6336c; }

  #touch button { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #fff8; background: #ffffff30; color: #fff; font: inherit; font-size: 20px; }
  #touch button:active { background: #ffffff70; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; font-size: 20px; text-align: center; padding: 30px; z-index: 9; background: #0b1530; }
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="hud"></canvas>
<a id="back" href="previous.html">← 돌아가기</a>
<div class="tb">
  <button id="bSnd" title="소리 (M)">🔊 소리</button>
  <button id="bVoi" title="음성 해설">🗣 해설</button>
  <button id="bMic" title="음성 명령: 왼쪽 / 오른쪽 / 가속 / 브레이크 / 부스터">🎤 음성명령</button>
</div>
<div id="toast"></div>
<div id="err">three.js를 불러오지 못했어요. 인터넷 연결을 확인하고, 로컬 서버(http://localhost)로 열어 주세요.</div>
<div id="touch">

  <div class="grp"><button id="tB">🍊</button><button id="tG">▲</button></div>
</div>

const sp01 = () => speed / maxSpeed;

/* ---------------- HUD ---------------- */

  rr(W / 2 - 85, 10, 170, 56, 14, 'rgba(10,20,50,.6)'); txt('TIME', W / 2, 28, 14, '#cfe', 'center', null); txt(Math.ceil(timeLeft) + '', W / 2, 60, 38, timeLeft < 10 && Math.floor(tm * 4) % 2 ? '#ff6a6a' : '#fff', 'center');
  if (bonusTime > 0) txt('+25초!', W / 2 + 125, 56, 30, '#ffe066', 'center', '#a64d00', 6);
  rr(12, 50, 230, 70, 14, 'rgba(10,20,50,.6)'); tang(36, 76, 13); txt('× ' + tangs, 56, 84, 26); txt(String(Math.floor(score)).padStart(7, '0'), 230, 84, 26, '#ffe9a8', 'right'); txt('SCORE', 24, 110, 14, '#cfe', 'left', null);

  const bw = 360, bx = W / 2 - bw / 2, by = 82; rr(bx, by, bw, 10, 5, 'rgba(0,0,0,.45)'); const pr = clamp(S / FINISH_S, 0, 1); rr(bx, by, Math.max(8, bw * pr), 10, 5, '#ffb02e');
